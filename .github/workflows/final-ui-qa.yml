name: Final UI Visual And Button QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.6.0"
          cache-read-only: true

      - name: Build debug APK
        run: |
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --warning-mode=all
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Appium UiAutomator2 and agent-device
        run: |
          npm install -g appium@latest agent-device@latest
          appium driver install uiautomator2
          appium driver list
          agent-device --version

      - name: Run visual and all-button QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 scripts/adb-ui-qa.py

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wifi-tv-remote-final-ui-qa
          path: |
            ui-qa-report.json
            ui-dark.png
            ui-light.png
            ui-apps.png
            ui-cast.png
            ui-settings.png
            ui-source-main.xml
            ui-source-keypad.xml
            ui-source-settings.xml
            appium-version.txt
            agent-device-version.txt
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: WifiTVRemote-final-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
