name: Full Android UI QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-ui-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Configure Git default branch
        run: git config --global init.defaultBranch main

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.6.0"
          cache-read-only: true

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --warning-mode=all

      - name: Verify debug APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Appium and agent-device
        run: |
          npm install -g appium@latest agent-device@0.21.15
          appium driver install uiautomator2
          appium driver doctor uiautomator2 || true

      - name: Run Android emulator, Appium and agent-device QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            nohup appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 &
            for i in $(seq 1 60); do
              curl -fsS http://127.0.0.1:4723/status >/dev/null && break
              sleep 1
            done
            test "$(curl -fsS http://127.0.0.1:4723/status | python3 -c 'import json,sys; print(json.load(sys.stdin).get("value",{}).get("ready",False))')" = "True"
            ANDROID_SERIAL="$(adb devices | awk 'NR>1 && $2=="device"{print $1;exit}')"
            test -n "$ANDROID_SERIAL"
            node scripts/full-ui-qa.mjs "$ANDROID_SERIAL"
            agent-device open com.tomasthrawat.wifitvremote --platform android --serial "$ANDROID_SERIAL" --session wifi-tv-remote-qa
            agent-device snapshot -i --platform android --serial "$ANDROID_SERIAL" --session wifi-tv-remote-qa > agent-device-snapshot.txt
            agent-device screenshot ui-final.png --platform android --serial "$ANDROID_SERIAL" --session wifi-tv-remote-qa
            agent-device close --session wifi-tv-remote-qa

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wifi-tv-remote-ui-qa-evidence
          path: |
            ui-qa-report.json
            ui-final.png
            agent-device-snapshot.txt
            appium.log
          if-no-files-found: warn
