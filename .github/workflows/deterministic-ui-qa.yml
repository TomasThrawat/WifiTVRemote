name: Deterministic UI Button QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Download verified APK build 157
        run: |
          curl -fL --retry 3 --retry-all-errors \
            -o wifi-tv-remote.apk \
            "https://github.com/TomasThrawat/WifiTVRemote/releases/download/v1.0.0-build-157/app-debug.apk"
          test -s wifi-tv-remote.apk
          sha256sum wifi-tv-remote.apk

      - name: Install Appium and UiAutomator2
        run: |
          npm install -g appium@latest
          appium driver install uiautomator2
          appium driver doctor uiautomator2 || true

      - name: Run Android UI test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r wifi-tv-remote.apk

            nohup appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 &
            for i in $(seq 1 60); do
              curl -fsS http://127.0.0.1:4723/status >/dev/null && break
              sleep 1
            done
            test "$(curl -fsS http://127.0.0.1:4723/status | python3 -c 'import json,sys; print(json.load(sys.stdin).get("value",{}).get("ready",False))')" = "True"

            node scripts/deterministic-ui-qa.mjs
            agent-device --version > agent-device-version.txt 2>&1 || true
            adb exec-out screencap -p > ui-final.png

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wifi-tv-remote-deterministic-ui-evidence
          path: |
            ui-qa-report.json
            ui-dark.png
            ui-light.png
            ui-final.png
            ui-source.xml
            appium.log
            agent-device-version.txt
          if-no-files-found: warn
