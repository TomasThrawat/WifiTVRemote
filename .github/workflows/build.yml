name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout wrapper
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Clone Android TV Remote implementation
        run: |
          git clone --depth 1 https://github.com/harimoradiya/androidtvremote.git upstream

      - name: Build upstream Android project
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p dist
          APK=$(find upstream/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" dist/WifiTVRemote-debug.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WifiTVRemote-debug
          path: dist/WifiTVRemote-debug.apk

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" dist/WifiTVRemote-debug.apk             --title "WifiTVRemote $TAG"             --notes "APK built from the current upstream Android TV Remote implementation."
