name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: WifiTVRemote-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Release
        env:
          GH_TOKEN: $GITHUB_TOKEN
        run: |
          TAG="v1.0.0-build-$GITHUB_RUN_NUMBER"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk --title "Wi-Fi TV Remote $TAG" --notes "Native Kotlin Android TV Remote Protocol v2 client."
