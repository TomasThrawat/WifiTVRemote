name: Build 175 Direct Emulator Screenshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Run managed Android emulator and capture Build 175
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          target: default
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: |
            set -euo pipefail

            curl -fL --retry 3 --retry-all-errors \
              -o app-debug.apk \
              "https://github.com/TomasThrawat/WifiTVRemote/releases/download/v1.0.0-build-175/app-debug.apk"

            test -s app-debug.apk
            echo "APK SHA-256:"
            sha256sum app-debug.apk
            test "$(sha256sum app-debug.apk | awk '{print $1}')" = "fa95f35beaed815793bd598b6c403db53a185b5bef46a47d9dbfa1b1b8744d41"

            adb install -r app-debug.apk
            adb shell am force-stop com.tomasthrawat.wifitvremote
            adb shell monkey -p com.tomasthrawat.wifitvremote -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 5

            mkdir -p screenshot-evidence
            adb exec-out screencap -p > screenshot-evidence/wifi-tv-remote-build-175.png
            adb exec-out uiautomator dump /sdcard/window.xml >/dev/null
            adb shell cat /sdcard/window.xml > screenshot-evidence/ui.xml

            test -s screenshot-evidence/wifi-tv-remote-build-175.png
            test -s screenshot-evidence/ui.xml
            file screenshot-evidence/wifi-tv-remote-build-175.png

      - name: Upload real screenshot
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: wifi-tv-remote-build-175-managed-screenshot
          path: screenshot-evidence/
          if-no-files-found: error
