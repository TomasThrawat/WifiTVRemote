name: UI Screenshot Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.6.0"
          cache-read-only: true

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --warning-mode=all

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Capture Android UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.tomasthrawat.wifitvremote || true
            adb shell monkey -p com.tomasthrawat.wifitvremote 1
            sleep 3
            adb shell dumpsys window | grep -E "mCurrentFocus|mFocusedApp" || true
            adb exec-out screencap -p > ui-full.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v7.0.1
        with:
          name: WifiTVRemote-ui-screenshot
          path: ui-full.png
          if-no-files-found: error
